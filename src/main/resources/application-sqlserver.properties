# Conexion recibida mediante variables de entorno.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Comprobar las tablas existentes.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Los scripts se ejecutan manualmente desde SSMS.
spring.sql.init.mode=never

# Guardar y recuperar fechas en UTC usando DATETIME2.
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP

# La consola H2 no se utiliza en este perfil.
spring.h2.console.enabled=false